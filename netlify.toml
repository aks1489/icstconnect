[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

# 1. Canonical Domain Redirection (301 Permanent)
[[redirects]]
  from = "https://www.icstconnect.in/*"
  to = "https://icstconnect.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.icstconnect.in/*"
  to = "https://icstconnect.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://icstconnect.in/*"
  to = "https://icstconnect.in/:splat"
  status = 301
  force = true

# 2. Admin Subdomain Redirection in Production (301 Permanent)
[[redirects]]
  from = "https://icstconnect.in/admin"
  to = "https://admin.icstconnect.in/"
  status = 301
  force = true

[[redirects]]
  from = "https://icstconnect.in/admin/*"
  to = "https://admin.icstconnect.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.icstconnect.in/admin"
  to = "https://admin.icstconnect.in/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.icstconnect.in/admin/*"
  to = "https://admin.icstconnect.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://admin.icstconnect.in/*"
  to = "https://admin.icstconnect.in/:splat"
  status = 301
  force = true

# 3. Legacy Route Redirections (301 Permanent - Scoped to main domain)
[[redirects]]
  from = "https://icstconnect.in/login"
  to = "https://icstconnect.in/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.icstconnect.in/login"
  to = "https://icstconnect.in/"
  status = 301
  force = true

# 4. Serverless API Function Rewrites (200 Proxy)
[[redirects]]
  from = "/api/send-email"
  to = "/.netlify/functions/send-email"
  status = 200

[[redirects]]
  from = "/api/smtp-verify"
  to = "/.netlify/functions/smtp-verify"
  status = 200

[[redirects]]
  from = "/api/create-auth-user"
  to = "/.netlify/functions/create-auth-user"
  status = 200

# 5. Single Page Application (SPA) Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
