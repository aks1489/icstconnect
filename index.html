<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('icst_theme_preference');
        var isDark = saved === 'dark' || ((!saved || saved === 'system') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        if (isDark) {
          root.classList.add('dark');
          root.classList.remove('light');
          root.setAttribute('data-theme', 'dark');
        } else {
          root.classList.add('light');
          root.classList.remove('dark');
          root.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https: http://localhost:5000; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; connect-src 'self' https: wss: http://localhost:5000;">
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ICST Connect - Chowberia</title>
  <meta name="description"
    content="ICST Connect - The official student portal for ICST Chowberia. Access courses, notifications, gallery, and online tests." />
  <meta name="keywords" content="ICST, Chowberia, Student Portal, Education, Online Tests, Courses" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1e3a8a" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
